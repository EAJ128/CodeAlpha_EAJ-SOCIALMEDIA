services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file}
      REFRESH_SECRET: ${REFRESH_SECRET:?Set REFRESH_SECRET in a .env file}
    volumes:
      - eaj-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  eaj-data:
