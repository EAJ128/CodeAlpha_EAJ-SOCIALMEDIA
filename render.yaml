# Render Blueprint — one-click deploy
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: eaj-social
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
    disk:
      name: eaj-social-data
      mountPath: /data
      sizeGB: 1
